name: Build and Push Refiner Docker Image

on:
  push:
    branches: [ main ]
    paths:
      - 'refiner/**'
      - '.github/workflows/docker-build-refiner.yml'
  workflow_dispatch:

env:
  DOCKER_USERNAME: romantony
  IMAGE_NAME: dreamx-creator-refiner
  VERSION: "1.0.0"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Free up disk space
      run: |
        df -h
        # torch==2.10.0+cu128 and its bundled CUDA libraries exceed the runner's
        # default free space, same as the base image build.
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
          /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /usr/lib/jvm
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo apt-get clean
        sudo docker image prune -af
        sudo docker builder prune -af
        df -h

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: refiner
        push: true
        tags: |
          ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
        # Separate cache scope so this and the base image don't evict each other's layers.
        cache-from: type=gha,scope=refiner
        cache-to: type=gha,mode=max,scope=refiner
